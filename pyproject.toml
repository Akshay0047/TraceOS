[project]
name = "traceos"
version = "0.1.0"
description = "Explainable workload observatory and OS experimentation lab (MVP)"
requires-python = ">=3.11"
dependencies = ["psutil>=6", "numpy>=2", "scikit-learn>=1.5", "PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
traceos = "traceos.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
